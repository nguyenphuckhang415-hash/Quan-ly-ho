{% extends 'base.html' %}{% block content %}<div class="card"><h2>👨‍👩‍👧 ĐĂNG KÝ PHỤ HUYNH</h2><form method="post" class="grid2"><label>Họ tên phụ huynh<input name="parent_name" required></label><label>Tên đăng nhập<input name="username" required></label><label>Mật khẩu<input name="password" type="password" minlength="6" required></label><label>Email<input name="email" type="email" required></label><label>Họ tên con<input name="student_name" required></label><label>Lớp của con<input name="class_name" list="classes" required></label><label>Tổ của con<input name="team" required></label><label>Giáo viên chủ nhiệm<input name="homeroom_teacher" value="{{teacher_name}}" required></label><div class="full"><button class="primary">GỬI YÊU CẦU</button></div></form><datalist id="classes">{% for c in classes %}<option value="{{c.class_name}}">{% endfor %}</datalist></div>{% endblock %}
