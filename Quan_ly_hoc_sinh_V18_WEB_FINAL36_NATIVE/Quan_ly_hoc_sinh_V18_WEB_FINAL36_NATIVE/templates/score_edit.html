{% extends 'base.html' %}{% block content %}<div class='card'><h2>✏️ SỬA ĐIỂM</h2><form method='post' class='grid2'><div><b>Học sinh</b><p>{{score.name}}</p></div><label>Tiêu chí<input name='criterion' value='{{score.criterion}}' required></label><label>Điểm<input name='points' type='number' value='{{score.points}}' required></label><label>Ghi chú<input name='note' value='{{score.note or ""}}'></label><div class='full'><button class='primary'>LƯU SỬA</button></div></form></div>{% endblock %}
