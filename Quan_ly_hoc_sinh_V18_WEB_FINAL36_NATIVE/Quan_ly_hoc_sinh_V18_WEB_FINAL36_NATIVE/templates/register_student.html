{% extends 'base.html' %}{% block content %}<div class="card"><h2>🎓 ĐĂNG KÝ HỌC SINH</h2><p>Hệ thống tự sinh tên đăng nhập và mật khẩu duy nhất cho học sinh và phụ huynh.</p><form method="post" class="grid2"><label>Họ tên học sinh<input name="name" required></label><label>Lớp<input name="class_name" list="classes" required></label><label>Tổ<input name="team" required></label><label>Giáo viên chủ nhiệm<input name="homeroom_teacher" value="{{teacher_name}}" required></label><label>Họ tên phụ huynh<input name="parent_name" required></label><label>Email phụ huynh<input name="parent_email" type="email" required></label><div class="full"><button class="primary">TẠO HỒ SƠ</button></div></form><datalist id="classes">{% for c in classes %}<option value="{{c.class_name}}">{% endfor %}</datalist></div>{% endblock %}
