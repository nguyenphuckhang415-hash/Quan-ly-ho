{% extends 'base.html' %}{% block content %}<div class="card"><h2>⭐ ĐIỂM CỘNG / TRỪ</h2><form method="post" class="grid2"><label>Học sinh<select name="student_id">{% for s in students %}<option value="{{s.id}}">{{s.name}} — {{s.class_name}} — Tổ {{s.team}}</option>{% endfor %}</select></label><label>Tiêu chí<input name="criterion" required></label><label>Điểm<input name="points" type="number" value="2"></label><label>Ghi chú<input name="note"></label><div class="full"><button class="primary">LƯU ĐIỂM</button></div></form></div><div class="card"><h3>Lịch sử</h3><table><tr><th>Học sinh</th><th>Lớp</th><th>Tổ</th><th>Tiêu chí</th><th>Điểm</th><th>Ghi chú</th><th>Ngày</th></tr>{% for r in scores %}<tr><td>{{r.name}}</td><td>{{r.class_name}}</td><td>{{r.team}}</td><td>{{r.criterion}}</td><td>{{r.points}}</td><td>{{r.note}}</td><td>{{r.created_at}}</td><td><a class="btn" href="{{url_for('edit_score_web',score_id=r.id)}}">Sửa</a> <form method="post" action="{{ url_for('delete_score',score_id=r.id) }}" style="display:inline"><button class="btn danger">Xóa</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
