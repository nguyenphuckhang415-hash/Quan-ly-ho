{% extends 'base.html' %}{% block content %}<div class="card"><h2>🏅 BAN CÁN SỰ</h2><form method="post" class="grid2"><label>Học sinh<select name="student_id">{% for s in students %}<option value="{{s.id}}">{{s.name}} — {{s.class_name}} — Tổ {{s.team}}</option>{% endfor %}</select></label><label>Vai trò<select name="role"><option>Lớp trưởng</option><option>Lớp phó</option><option>Tổ trưởng</option><option>Tổ phó</option><option>Thư ký</option></select></label><label>Phạm vi<select name="scope"><option>Không làm gì cả</option><option>Chỉ xem</option><option>Quản lý tổ</option><option>Quản lý lớp</option></select></label><div class="full"><button class="primary">LƯU QUYỀN</button></div></form></div><div class="card"><table><tr><th>Học sinh</th><th>Lớp</th><th>Tổ</th><th>Vai trò</th><th>Phạm vi</th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.class_name}}</td><td>{{r.team}}</td><td>{{r.role}}</td><td>{{r.scope}}</td></tr>{% endfor %}</table></div>{% endblock %}
