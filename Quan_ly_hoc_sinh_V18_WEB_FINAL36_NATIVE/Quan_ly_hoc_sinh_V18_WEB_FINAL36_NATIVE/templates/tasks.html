{% extends 'base.html' %}{% block content %}<div class="card"><h2>🧹 PHÂN CÔNG</h2><form method="post" class="grid2"><label>Học sinh<select name="student_id">{% for s in students %}<option value="{{s.id}}">{{s.name}} — {{s.class_name}} — Tổ {{s.team}}</option>{% endfor %}</select></label><label>Ngày<input name="task_date" type="date" value="{{now_date if now_date else ''}}"></label><label>Nhiệm vụ<select name="task"><option>Trực nhật</option><option>Quét lớp</option><option>Lau bảng</option><option>Đổ rác</option><option>Xếp bàn ghế</option><option>Chăm sóc cây</option><option>Chuẩn bị đồ dùng</option><option>Khác</option></select></label><label>Trạng thái<select name="status"><option>Chưa hoàn thành</option><option>Đã hoàn thành</option><option>Không hoàn thành</option></select></label><label>Điểm<input name="points" type="number" value="2"></label><label>Ghi chú<input name="note"></label><div class="full"><button class="primary">LƯU PHÂN CÔNG</button></div></form></div><div class="card"><table><tr><th>Học sinh</th><th>Ngày</th><th>Nhiệm vụ</th><th>Trạng thái</th><th>Điểm</th><th>Ghi chú</th></tr>{% for r in tasks %}<tr><td>{{r.name}}</td><td>{{r.task_date}}</td><td>{{r.task}}</td><td>{{r.status}}</td><td>{{r.points}}</td><td>{{r.note}}</td><td><form method="post" action="{{ url_for('delete_task',task_id=r.id) }}"><button class="btn danger">Xóa</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
