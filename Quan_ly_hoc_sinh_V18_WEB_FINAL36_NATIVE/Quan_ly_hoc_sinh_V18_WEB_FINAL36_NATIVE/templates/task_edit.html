{% extends 'base.html' %}{% block content %}<div class='card'><h2>✏️ SỬA NHIỆM VỤ</h2><form method='post' action='{{url_for("tasks_page")}}' class='grid2'><div><b>Học sinh</b><p>{{task.name}}</p></div><label>Ngày<input name='task_date' type='date' value='{{task.task_date}}'></label><label>Nhiệm vụ<input name='task' value='{{task.task}}' required></label><label>Trạng thái<select name='status'><option {% if task.status=='Chưa hoàn thành' %}selected{% endif %}>Chưa hoàn thành</option><option {% if task.status=='Đã hoàn thành' %}selected{% endif %}>Đã hoàn thành</option><option {% if task.status=='Không hoàn thành' %}selected{% endif %}>Không hoàn thành</option></select></label><label>Điểm<input name='points' type='number' value='{{task.points}}'></label><label>Ghi chú<input name='note' value='{{task.note or ""}}'></label><input type='hidden' name='student_id' value='{{task.student_id}}'><div class='full'><button class='primary'>LƯU LẠI</button></div></form></div>{% endblock %}
