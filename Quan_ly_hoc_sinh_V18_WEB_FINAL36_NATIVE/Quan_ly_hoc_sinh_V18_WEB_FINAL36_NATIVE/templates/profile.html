{% extends 'base.html' %}{% block content %}<div class="card"><h2>🔐 THÔNG TIN CỦA TÔI</h2><form method="post" class="grid2">{% if user.role=='teacher' %}<label>Tên hiển thị<input name="display_name" value="{{profile.display_name}}"></label><label>Mã giáo viên<input name="verification_code" value="{{profile.verification_code}}"></label>{% else %}<label>Tên phụ huynh<input name="parent_name" value="{{profile.parent_name}}"></label><label>Email<input name="parent_email" value="{{profile.parent_email}}"></label><label>Tổ<input name="team" value="{{profile.team}}"></label><label>Tên nhóm<input name="group_name" value="{{profile.group_name}}"></label>{% endif %}<div class="full"><button class="primary">LƯU</button></div></form></div>{% endblock %}
